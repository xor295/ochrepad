[package]
name = "ochrepad-core"
description = "Text model and editing engine of the ochrepad text editor (internal; no stable API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["text-editor", "rope", "multi-cursor", "undo"]
categories = ["text-editors"]

[dependencies]
regex-cursor = { version = "=0.1.5", default-features = false, features = ["perf-inline"] }
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
serde = { version = "=1.0.229", features = ["derive"] }
similar = "=3.2.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.151"

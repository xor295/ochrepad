[package]
name = "ochrepad-fileio"
description = "Encoding-preserving loading and atomic saving for the ochrepad text editor (internal; no stable API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["encoding", "line-endings", "atomic-write"]
categories = ["text-editors", "encoding"]

[dependencies]
chardetng = "=1.0.0"
directories = "=6.0.0"
encoding_rs = "=0.8.42"
ochrepad-core.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"

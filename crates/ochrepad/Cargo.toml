[package]
name = "ochrepad"
description = "A fast, native text editor in the spirit of Notepad++"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["text-editor", "editor", "notepad", "egui", "gui"]
categories = ["text-editors"]

[dependencies]
# The terminal (terminal.rs): VT parser, grid with scrollback, and the
# pseudo-terminal (ConPTY on Windows, openpty on Linux) with its I/O thread.
alacritty_terminal = { version = "=0.26.0", default-features = false }
eframe = "=0.36.2"
egui = "=0.36.2"
egui_commonmark = { version = "=0.25.0", features = ["better_syntax_highlighting", "svg"] }
egui_dock = { version = "=0.21.1", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "webp"] }
notify = "=8.2.0"
ochrepad-core.workspace = true
ochrepad-fileio.workspace = true
ochrepad-lsp.workspace = true
ochrepad-syntax.workspace = true
# SVGs in the Markdown preview with a restricted <image> resolver
# (safe_images.rs); the same version egui_extras already uses.
resvg = { version = "=0.45.1", default-features = false }
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "=1.13.3"

# Embeds the icon in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[dev-dependencies]
ochrepad-lsp = { workspace = true, features = ["testing"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
tempfile = "=3.27.0"

[features]
# Expose the egui inspection protocol (PLAN 6); run with EGUI_INSPECTION=1.
dev-inspect = ["eframe/inspection"]

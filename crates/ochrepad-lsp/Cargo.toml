[package]
name = "ochrepad-lsp"
description = "The language server client of the ochrepad text editor (internal; no stable API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["lsp", "language-server", "editor"]
categories = ["text-editors", "development-tools"]

[dependencies]
# The protocol's types (approved in PLAN_completion). JSON-RPC framing and
# the processes are ours.
lsp-types = "=0.97.0"
ochrepad-core.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
# A scripted server on a thread (`testing::FakeServer`), for tests here
# and in the app.
testing = []

[dev-dependencies]
tempfile = "=3.27.0"

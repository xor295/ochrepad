[package]
name = "ochrepad-syntax"
description = "Incremental syntect highlighting for the ochrepad text editor (internal; no stable API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["syntax-highlighting", "syntect"]
categories = ["text-editors"]

[dependencies]
ochrepad-core.workspace = true
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-default-fancy"] }

[dev-dependencies]
proptest = "=1.11.0"

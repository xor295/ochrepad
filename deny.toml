# cargo deny (https://embarkstudios.github.io/cargo-deny/): CI checks every
# dependency for security advisories, licenses, where it comes from, and
# duplicate versions. Run it locally with `cargo deny check`.

[graph]
# The platforms ochrepad supports; crates only other platforms use are left
# out of every check.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Every vulnerability and unsound crate, and any yanked version, fails the
# check unless it is listed under `ignore` with the reason. A crate marked
# unmaintained fails only when the workspace depends on it directly: deep in
# egui's and syntect's trees (bincode, yaml-rust, paste, ttf-parser, zbus)
# there is nothing to choose.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only; the fonts egui embeds use the OFL and the Ubuntu
# Font Licence.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common in the egui tree; they are
# reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path and version.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
